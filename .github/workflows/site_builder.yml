name: Build and Deploy Site

on:
  workflow_dispatch:
  push:
    branches: [src]
  pull_request:
    branches: [src]
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: "!contains(github.event.head_commit.message, '(CI)')"
    runs-on: ubuntu-latest
    env:
      HUGO_ENVIRONMENT: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true  # Fetch Hugo themes
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.0
        with:
          # Enable caching for the pixi environment.
          cache: true

      - name: Install Node and Ruby Dependencies
        run: pixi run npm install && pixi run bundle install

      - name: Install dart-sass
        uses: dw-labs-org/dart-sass-gha@v1

      - name: Restore Hugo Cache
        id: hugo-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: public
          key: ${{ runner.os }}-hugo-${{ hashFiles('**/pixi.lock') }}
          restore-keys: |
            ${{ runner.os }}-hugo-

      - name: Configure Git
        run: git config --global core.quotepath false

      - name: Restore Trackback Cache
        id: trackback-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .sent_trackbacks.log
          key: ${{ runner.os }}-trackbacks-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-trackbacks-

      - name: Build site with Hugo
        run: pixi run bundle exec rake hugoBuild

      - name: Verify Build Integrity
        run: |
          # Use 400 as a floor if .page_count doesn't exist yet
          OLD_COUNT=$(cat .page_count 2>/dev/null || echo 400)
          NEW_COUNT=$(find public -name "*.html" | wc -l)
          echo "Previous count: $OLD_COUNT | Current count: $NEW_COUNT"

          # Fail if the page count drops by more than 10%
          if [ "$NEW_COUNT" -lt $((OLD_COUNT * 90 / 100)) ]; then
            echo "::error::Significant page drop detected! Found $NEW_COUNT pages, expected near $OLD_COUNT."
            echo "This prevents deploying a broken build where Emacs/Org export crashed."
            exit 1
          fi
          echo "$NEW_COUNT" > .page_count

      - name: Send arXiv Trackbacks
        if: github.event_name == 'push' && github.ref == 'refs/heads/src'
        run: pixi run uv run scripts/arxiv_trackbacks.py --site-url "https://rgoswami.me"

      - name: Commit and Push Updated Metrics and Logs
        if: github.event_name == 'push' && github.ref == 'refs/heads/src'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Check for changes in both the trackback log and the page count metric
          if ! git diff --quiet .sent_trackbacks.log .page_count; then
            git add .sent_trackbacks.log .page_count
            git commit -m "DOCS: Update metrics and trackbacks (CI)"
            git push
            echo "Metrics and logs were updated and pushed."
          else
            echo "No changes to metrics or logs."
          fi

      - name: Save Trackback Log
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .sent_trackbacks.log
          key: ${{ steps.trackback-cache-restore.outputs.cache-primary-key || format('{0}-trackbacks-{1}', runner.os, github.ref_name) }}

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/src' && !contains(github.event.head_commit.message, 'ImgBot')
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          publish_branch: gh-pages
          publish_dir: ./public
          keep_files: true
          enable_jekyll: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
