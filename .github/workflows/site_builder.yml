name: Build and Deploy Site

on:
  workflow_dispatch:
  push:
    branches: [src]
  pull_request:
    branches: [src]
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: "!contains(github.event.head_commit.message, '(CI)')"
    runs-on: ubuntu-latest
    env:
      HUGO_ENVIRONMENT: production

    steps:
      - name: Check out human source
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          cache: true

      - name: Install Dependencies
        run: pixi run npm install && pixi run bundle install

      - name: Install dart-sass
        uses: dw-labs-org/dart-sass-gha@v1

      - name: Fetch Bot Metrics
        run: |
          git fetch origin bot-metrics:bot-metrics || true
          git checkout bot-metrics -- .sent_trackbacks.log .page_count || echo "Initializing metrics"
          git checkout bot-metrics -- .unverified_trackbacks.log 2>/dev/null \
            || echo "No prior unverified log; starting fresh"

      - name: Build site with Hugo
        run: pixi run bundle exec rake hugoBuild

      - name: Verify Build Integrity
        run: |
          OLD_COUNT=$(cat .page_count 2>/dev/null || echo 400)
          NEW_COUNT=$(find public -name "*.html" | wc -l)
          echo "Previous count: $OLD_COUNT | Current count: $NEW_COUNT"

          if [ "$NEW_COUNT" -lt $((OLD_COUNT * 90 / 100)) ]; then
            echo "::error::Significant page drop! Found $NEW_COUNT, expected ~$OLD_COUNT."
            exit 1
          fi
          echo "$NEW_COUNT" > .page_count

      - name: Send arXiv Trackbacks
        if: github.event_name == 'push' && github.ref == 'refs/heads/src'
        # uv run handles the script execution without needing a pyproject.toml sync
        run: pixi run uv run scripts/arxiv_trackbacks.py --site-url "https://rgoswami.me" --verify

      - name: Update and Push Bot Metrics Branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/src'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p ../temp_metrics
          cp .sent_trackbacks.log .page_count ../temp_metrics/
          [ -f .unverified_trackbacks.log ] && cp .unverified_trackbacks.log ../temp_metrics/ || true
          git checkout bot-metrics || git checkout --orphan bot-metrics
          git rm -rf . || true
          cp ../temp_metrics/.sent_trackbacks.log ../temp_metrics/.page_count .
          [ -f ../temp_metrics/.unverified_trackbacks.log ] && cp ../temp_metrics/.unverified_trackbacks.log . || true
          git add .sent_trackbacks.log .page_count
          [ -f .unverified_trackbacks.log ] && git add .unverified_trackbacks.log || true
          git commit -m "Update metrics and trackbacks (CI)" || echo "No changes"
          git push origin bot-metrics

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/src'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./public --project-name=rgoswami-me --branch=src
