<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Mail archive architecture</title>
  <desc id="desc">Microsoft 365 feeds DavMail, mbsync, Maildir, Dovecot, and laptop clients through an archive host.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#374151"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: #1f2937; }
      .title { font-size: 28px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 700; }
      .small { font-size: 14px; }
      .tiny { font-size: 12px; fill: #4b5563; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 8; }
      .host { fill: #f8fafc; stroke: #0f766e; stroke-width: 3; rx: 10; }
      .edge { fill: #eef2ff; stroke: #4338ca; stroke-width: 2; rx: 8; }
      .store { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 8; }
      .client { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 8; }
      .arrow { stroke: #374151; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="620" fill="#f3f4f6"/>
  <text x="50" y="54" class="title">A boring mail archive around Microsoft 365</text>
  <text x="50" y="82" class="small">DavMail keeps OAuth at the edge; the archive host owns durable Maildir state.</text>

  <rect x="50" y="145" width="190" height="110" class="edge"/>
  <text x="75" y="184" class="label">Microsoft 365</text>
  <text x="75" y="214" class="small">Exchange / EWS</text>
  <text x="75" y="238" class="tiny">tenant policy lives here</text>

  <rect x="310" y="105" width="560" height="390" class="host"/>
  <text x="340" y="145" class="label">Archive host</text>
  <text x="340" y="170" class="tiny">always-on Linux machine</text>

  <rect x="350" y="215" width="170" height="92" class="edge"/>
  <text x="374" y="248" class="label">DavMail</text>
  <text x="374" y="276" class="small">one unit per account</text>
  <text x="374" y="296" class="tiny">localhost ports only</text>

  <rect x="565" y="215" width="150" height="92" class="box"/>
  <text x="594" y="248" class="label">mbsync</text>
  <text x="594" y="276" class="small">IMAP fetch</text>
  <text x="594" y="296" class="tiny">sync state here</text>

  <rect x="755" y="215" width="90" height="92" class="box"/>
  <text x="777" y="248" class="label">msmtp</text>
  <text x="772" y="276" class="small">send</text>

  <rect x="430" y="360" width="210" height="88" class="store"/>
  <text x="462" y="393" class="label">Maildir store</text>
  <text x="462" y="421" class="small">~/.mail/stores/*</text>

  <rect x="690" y="360" width="150" height="88" class="store"/>
  <text x="724" y="393" class="label">Dovecot</text>
  <text x="716" y="421" class="small">namespaced IMAP</text>

  <rect x="960" y="150" width="190" height="96" class="client"/>
  <text x="999" y="185" class="label">Laptop GUI</text>
  <text x="995" y="214" class="small">Evolution / client</text>

  <rect x="960" y="320" width="190" height="96" class="client"/>
  <text x="1006" y="355" class="label">Search</text>
  <text x="1000" y="384" class="small">notmuch / scripts</text>

  <path class="arrow" d="M240 200 C275 200 292 248 350 258"/>
  <path class="arrow" d="M520 260 L565 260"/>
  <path class="arrow" d="M715 260 L755 260"/>
  <path class="arrow" d="M640 307 C640 335 600 350 560 360"/>
  <path class="arrow" d="M640 405 L690 405"/>
  <path class="arrow" d="M840 405 C905 405 910 201 960 198"/>
  <path class="arrow dash" d="M960 368 C900 368 895 405 840 405"/>
  <path class="arrow dash" d="M960 368 C880 368 780 420 640 420"/>

  <text x="258" y="185" class="tiny">OAuth, EWS</text>
  <text x="526" y="225" class="tiny">local IMAP</text>
  <text x="720" y="225" class="tiny">local SMTP</text>
  <text x="900" y="475" class="tiny">SSH tunnel or private address</text>
</svg>
