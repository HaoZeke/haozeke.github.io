# Maintained packages inventory for https://rgoswami.me/packages/
# Edit this file to add/remove packages. Run: python scripts/check_packages_catalog.py
# Optional refresh helpers live in scripts/ (offline-friendly check is the CI gate).

updated: "2026-07-08"
title: Packages I maintain
intro: >
  A single inventory of packages I maintain or co-maintain across common
  registries. Versions are snapshots for orientation; registry links are
  authoritative. Seeded from AUR maintainer HaoZeke, conda-forge feedstocks,
  PyPI, and crates.io user HaoZeke.

