baseurl = "https://rgoswami.me/"
languageCode = "en-us"
theme = ["hugo-search-fuse-js", "hello-friend-ng-hz"]


# rssLimit  = 10  # Maximum number of items in the RSS feed.
copyright = "This work is licensed under a Creative Commons Attribution-NonCommercial 4.0 International License." # This message is only used by the RSS template.

# disqusShortname = ""

archetypeDir = "archetypes"
contentDir   = "content"
dataDir      = "data"
layoutDir    = "layouts"
publishDir   = "public"

buildDrafts  = false
buildFuture  = false
buildExpored = false
canonifyURLs = false # Legacy

enableRobotsTXT = true
enableEmoji     = true
enableMissingTranslationPlaceholders = false

disableRSS     = false
disableSitemap = false
disable404     = false
disableHugoGeneratorInject = false

[frontmatter]
  lastmod = ["lastmod", ":git", "date", "publishDate"]
[caches]
  [caches.images]
    dir = ':cacheDir/images'

[outputFormats]
[outputFormats.TOML]
mediaType = "application/toml"

[outputs]
  home = ["HTML", "RSS", "TOML", "JSON"]

[taxonomies]
  author   = "authors"
  tag      = "tags"
  category = "categories"
  search   = "search"
  series   = "series"

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    hl_Lines = ""
    lineNoStart = 1
    lineNos = true
    lineNumbersInTable = false
    noClasses = false
    style = "solarized-dark256"
    tabWidth = 2
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2
  [markup.goldmark]
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
      linkify = true
      linkifyProtocol = 'https'
      strikethrough = true
      table = true
      taskList = true
      typographer = true
    [markup.goldmark.renderer]
      unsafe = true

# TODO: Use in theme
[params.author]
name = "Rohit Goswami (HaoZeke)"

[author]
  name = "Rohit Goswami (HaoZeke)"

[params]
  dateform        = "Jan 2, 2006"
  dateformShort   = "Jan 2"
  dateformNum     = "2006-01-02"
  dateformNumTime = "2006-01-02 15:04 -0700"

  # From my fork
  littlefoot = true
  prism = false
  codefold = true
  praiseNetlify = false
  showHumanAuthorBadge = false

  # Set disableReadOtherPosts to true in order to hide the links to other posts.
  disableReadOtherPosts = false

  # Metadata mostly used in document's head
  description = "Homepage and blog by Rohit Goswami (HaoZeke)"
  summary = "Homepage and blog by Rohit Goswami (HaoZeke), focused on the physical sciences and code. Opinions may also creep in."
  homeSubtitle = "Reminisces and reflections of the digital entity defined here and below"
  # TODO(rg): <u> should be handled by the CSS for the links on the index..
  homeAddl = "Consider checking the [<u>Blog</u>](https://rgoswami.me/posts/), [<u>Snippets</u>](https://rgoswami.me/snippets/), or my [<u>Research Profile</u>](https://research.rgoswami.me)"
  keywords = "homepage, blog, science, development, programming"
  images = ["/images/RG.png"]

  # Directory name of your blog content (default is `content/posts`)
  contentTypeName = "posts"

  # Default theme "light" or "dark"
  defaultTheme = "dark"
  # Show sharing icons? (currently broken)
  sharingIcons = true

[params.search]
  enable = true
  backend = "docsearch" # can be stork, fuse, or docsearch
  searchableSections = ["posts", "snippets"]

