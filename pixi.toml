[workspace]
authors = ["Rohit Goswami <rgoswami@ieee.org>"]
channels = ["conda-forge"]
name = "haozeke.github.io"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
org = "make md"
build = { cmd = "hugo --minify", depends-on = ["org"] }
serve = "hugo server -D --bind 0.0.0.0 --port 1313"

[dependencies]
pandoc = ">=3.6.4,<4"
nodejs = ">=22.13.0,<22.14"
ruby = ">=3.4.2,<4"
git = ">=2.49.0,<3"
curl = ">=8.13.0,<9"
python = ">=3.13.3,<3.14"
emacs = ">=30.1,<31"
hugo = ">=0.148.2,<0.149"
uv = ">=0.8.13,<0.9"

[pypi-dependencies]
pandoc = ">=2.4, <3"
panflute = ">=2.3.1"

[tasks.check-packages]
cmd = "python scripts/check_packages_catalog.py && python -m unittest tests.test_packages_catalog -v"
description = "Validate data/packages.yaml shape and registry hosts"

[tasks.scan-packages]
cmd = "python scripts/scan_package_registries.py"
description = "Online registry scan vs data/packages.yaml (drift report)"

[tasks.scan-packages-nix]
cmd = "python scripts/scan_package_registries.py --nixpkgs-root /tmp/nixpkgs-2511"
description = "Registry scan including local nixpkgs tree if present"

[tasks.test-post-pdf]
cmd = "bundle exec rake test_post_pdf"
description = "Unit tests for per-page PDF generator (no chromium)"

[tasks.post-pdf]
cmd = "bundle exec rake postPdf"
description = "Incremental light/dark PDFs for posts/snippets/packages"

[tasks.post-pdf-force]
cmd = "POST_PDF_FORCE=1 bundle exec rake postPdf"
description = "Force rebuild all post PDFs"

[tasks.post-pdf-publish]
cmd = "bundle exec rake postPdfPublish"
description = "Force-push PDFs to orphan post-pdfs branch (single commit)"

[tasks.post-pdf-restore]
cmd = "bundle exec rake postPdfRestore"
description = "Restore PDFs from orphan post-pdfs for incremental rebuild"
